name: Dependencies Example

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup NPM
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Verify directory listing and contents
      run: ls -alhR
      
