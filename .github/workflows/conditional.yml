name: Conditional Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Kies de gewenste omgeving'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        if: ${{ github.event.inputs.environment == 'production' }}
        run: echo "Deploying to production!"

      - name: Run in test mode
        if: ${{ github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging' }}
        run: echo "Running in test mode"

      - name: Show chosen environment
        run: |
          echo "Gekozen environment: ${{ github.event.inputs.environment }}"
