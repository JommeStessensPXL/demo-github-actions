name: Steps Examples

on:
  workflow_dispatch:

jobs:
  run-steps:
    runs-on: ubuntu-latest

    steps:
      - name: Create testmachine directory
        run: mkdir testmachine

      - name: Write uname output to file
        run: uname -a > testmachine/output.txt

      - name: Show contents of output.txt
        run: cat testmachine/output.txt

      - name: List directory contents recursively
        run: ls -alhR
